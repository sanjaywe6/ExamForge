{% extends "base.html" %}

{% block title %}Login — Examination Portal{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-5">
        <div class="card shadow-sm">
            <div class="card-body p-4 text-center">
                <h1 class="h3 mb-4">Choose Login Type</h1>
                <p class="text-muted mb-4">Select which login you want to use</p>
                <div class="d-grid gap-2">
                    <a class="btn btn-primary" href="{% url 'accounts:login_student' %}">Student Login</a>
                    <a class="btn btn-outline-primary" href="{% url 'accounts:login_teacher' %}">Teacher Login</a>
                    <a class="btn btn-outline-secondary" href="{% url 'accounts:login_college' %}">College Admin Login</a>
                </div>
                <hr class="my-4">
                <p class="text-center text-muted mb-0">Don't have an account? <a href="{% url 'accounts:register' %}">Register as College Admin</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
