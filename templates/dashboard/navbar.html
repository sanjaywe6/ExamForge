{% load static %}
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom fixed-top shadow-sm">
  <div class="container-fluid">
    <button class="btn btn-outline-secondary d-lg-none me-2" type="button" data-bs-toggle="collapse" data-bs-target="#sidebarMenu" aria-controls="sidebarMenu" aria-expanded="false" aria-label="Toggle navigation">
      <i class="bi bi-list"></i>
    </button>
    <a class="navbar-brand fw-bold me-3" href="#">{{ college.name|default:"College" }}</a>
    <div class="d-flex align-items-center ms-auto gap-3">
      <div class="d-none d-md-block text-muted small">{{ user.get_full_name|default:user.email }}</div>
      <div class="dropdown">
        <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" id="profileDropdown" data-bs-toggle="dropdown" aria-expanded="false">
          <i class="bi bi-person-circle"></i>
        </button>
        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="profileDropdown">
          <li><a class="dropdown-item" href="#">Edit Profile</a></li>
          <li>
            <form method="post" action="{% url 'accounts:logout' %}" class="d-inline">
              {% csrf_token %}
              <button type="submit" class="dropdown-item">Logout</button>
            </form>
          </li>
        </ul>
      </div>
    </div>
  </div>
</nav>
