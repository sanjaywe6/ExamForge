{% extends "base.html" %}

{% block title %}{{ exam.title }} — Instructions{% endblock %}

{% block content %}
<div class="card">
    <div class="card-body">
        <h2>{{ exam.title }}</h2>
        <p class="text-muted">By {{ exam.created_by }}</p>
        <hr>
        <h5>Instructions</h5>
        <p>{{ exam.description|default:"No instructions provided." }}</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-primary">I Agree & Start Exam</button>
            <a href="{% url 'exams:student_exams' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
